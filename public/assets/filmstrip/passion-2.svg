<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 728" fill="none">
  <rect width="1120" height="728" fill="#080808"/>
  <g opacity="0.18" stroke="#EBA602" stroke-width="1">
    <line x1="0" y1="120" x2="1120" y2="120"/>
    <line x1="0" y1="240" x2="1120" y2="240"/>
    <line x1="0" y1="360" x2="1120" y2="360"/>
    <line x1="0" y1="480" x2="1120" y2="480"/>
    <line x1="0" y1="600" x2="1120" y2="600"/>
    <line x1="224" y1="0" x2="224" y2="728"/>
    <line x1="448" y1="0" x2="448" y2="728"/>
    <line x1="672" y1="0" x2="672" y2="728"/>
    <line x1="896" y1="0" x2="896" y2="728"/>
  </g>
  <!-- Inverted Diagonal Slash -->
  <polygon points="450,0 1120,0 1120,728 280,728" fill="#080808"/>
  <polygon points="0,0 520,0 340,728 0,728" fill="#FE0000"/>
  <polygon points="505,0 540,0 360,728 325,728" fill="#FBFAF4"/>
  <!-- Straw Hat Visual -->
  <g transform="translate(80, 160)">
    <rect x="0" y="0" width="400" height="260" fill="#080808" stroke="#FBFAF4" stroke-width="6"/>
    <!-- Straw Hat Geometry -->
    <ellipse cx="200" cy="160" rx="150" ry="40" fill="#EBA602" stroke="#FBFAF4" stroke-width="6"/>
    <path d="M 120 150 C 120 90, 280 90, 280 150 Z" fill="#EBA602" stroke="#FBFAF4" stroke-width="6"/>
    <path d="M 120 140 Q 200 155 280 140" stroke="#FE0000" stroke-width="12" fill="none"/>
    <text x="28" y="44" fill="#FBFAF4" font-family="monospace" font-weight="900" font-size="20">REEL 02 // ONE PIECE</text>
  </g>
  <!-- Typography -->
  <text x="80" y="540" fill="#FBFAF4" font-family="sans-serif" font-weight="900" font-size="72" letter-spacing="-2">ONE PIECE</text>
  <text x="80" y="605" fill="#FBFAF4" font-family="monospace" font-weight="700" font-size="28">EIICHIRO ODA // MONKEY D. LUFFY</text>
  <text x="80" y="650" fill="#EBA602" font-family="monospace" font-weight="700" font-size="22">GEAR 5 // LIBERDADE, CORAGEM &amp; NAKAMAS</text>
  <!-- Right Badge -->
  <g transform="translate(680, 220) rotate(-4)">
    <rect x="0" y="0" width="360" height="130" fill="#FE0000" stroke="#FBFAF4" stroke-width="6"/>
    <text x="30" y="58" fill="#FBFAF4" font-family="monospace" font-weight="900" font-size="32">KING OF PIRATES</text>
    <text x="30" y="98" fill="#080808" font-family="monospace" font-weight="700" font-size="20">O TESOURO É A JORNADA</text>
  </g>
</svg>
