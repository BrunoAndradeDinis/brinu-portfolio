  </g>
  <!-- Typography -->
  <text x="80" y="540" fill="#FBFAF4" font-family="sans-serif" font-weight="900" font-size="72" letter-spacing="-2">COWBOY BEBOP</text>
  <text x="80" y="605" fill="#FBFAF4" font-family="monospace" font-weight="700" font-size="28">SHINICHIRO WATANABE &amp; YOKO KANNO</text>
  <text x="80" y="650" fill="#EBA602" font-family="monospace" font-weight="700" font-size="22">SEE YOU SPACE COWBOY... EASY COME, EASY GO</text>
