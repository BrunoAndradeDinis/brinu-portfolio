<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 728" fill="none">
  <rect width="1120" height="728" fill="#080808"/>
  <g opacity="0.2" stroke="#FE0000" stroke-width="1">
    <line x1="0" y1="120" x2="1120" y2="120"/>
    <line x1="0" y1="240" x2="1120" y2="240"/>
    <line x1="0" y1="360" x2="1120" y2="360"/>
    <line x1="0" y1="480" x2="1120" y2="480"/>
    <line x1="0" y1="600" x2="1120" y2="600"/>
    <line x1="224" y1="0" x2="224" y2="728"/>
    <line x1="448" y1="0" x2="448" y2="728"/>
    <line x1="672" y1="0" x2="672" y2="728"/>
    <line x1="896" y1="0" x2="896" y2="728"/>
  </g>
  <!-- Inverted Diagonal Slash -->
  <polygon points="560,0 1120,0 1120,728 360,728" fill="#FE0000"/>
  <polygon points="540,0 575,0 375,728 340,728" fill="#FBFAF4"/>
  <!-- Space Cowboy Silhouette & Swordfish Graphic -->
