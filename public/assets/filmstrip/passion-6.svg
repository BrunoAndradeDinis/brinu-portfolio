<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 728" fill="none">
  <rect width="1120" height="728" fill="#080808"/>
  <g opacity="0.2" stroke="#FE0000" stroke-width="1">
    <line x1="0" y1="120" x2="1120" y2="120"/>
    <line x1="0" y1="240" x2="1120" y2="240"/>
    <line x1="0" y1="360" x2="1120" y2="360"/>
    <line x1="0" y1="480" x2="1120" y2="480"/>
    <line x1="0" y1="600" x2="1120" y2="600"/>
    <line x1="224" y1="0" x2="224" y2="728"/>
    <line x1="448" y1="0" x2="448" y2="728"/>
    <line x1="672" y1="0" x2="672" y2="728"/>
    <line x1="896" y1="0" x2="896" y2="728"/>
  </g>
  <!-- Inverted Diagonal Slash -->
  <polygon points="480,0 1120,0 1120,728 280,728" fill="#FE0000"/>
  <polygon points="460,0 495,0 295,728 260,728" fill="#FBFAF4"/>
  <!-- Bowl & Ramen/Comfort Food Geometry -->
  <g transform="translate(80, 160)">
    <rect x="0" y="0" width="400" height="260" fill="#080808" stroke="#FBFAF4" stroke-width="6"/>
    <!-- Bowl -->
    <path d="M 120 150 Q 120 220 200 220 Q 280 220 280 150 Z" fill="#FE0000" stroke="#FBFAF4" stroke-width="6"/>
    <!-- Chopsticks -->
    <line x1="100" y1="120" x2="290" y2="140" stroke="#EBA602" stroke-width="6" stroke-linecap="round"/>
    <line x1="110" y1="110" x2="300" y2="130" stroke="#EBA602" stroke-width="6" stroke-linecap="round"/>
    <!-- Steam -->
    <path d="M 170 120 Q 160 90 180 70" stroke="#FBFAF4" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 200 120 Q 210 90 190 70" stroke="#FBFAF4" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 230 120 Q 220 90 240 70" stroke="#FBFAF4" stroke-width="4" stroke-linecap="round" fill="none"/>
    <text x="28" y="44" fill="#FBFAF4" font-family="monospace" font-weight="900" font-size="20">REEL 06 // CULINÁRIA &amp; AFETO</text>
  </g>
  <!-- Typography -->
  <text x="80" y="540" fill="#FBFAF4" font-family="sans-serif" font-weight="900" font-size="72" letter-spacing="-2">STREET FOOD &amp; SOUL</text>
  <text x="80" y="605" fill="#FBFAF4" font-family="monospace" font-weight="700" font-size="28">IZAKAYA &amp; COMFORT FOOD // CULINÁRIA AFETIVA</text>
  <text x="80" y="650" fill="#EBA602" font-family="monospace" font-weight="700" font-size="22">ALQUIMIA DE SABORES // FOGO, TEMPO &amp; MEMÓRIA</text>
  <!-- Right Badge -->
  <g transform="translate(680, 210) rotate(-4)">
    <rect x="0" y="0" width="370" height="130" fill="#080808" stroke="#FBFAF4" stroke-width="6"/>
    <text x="30" y="58" fill="#EBA602" font-family="monospace" font-weight="900" font-size="32">UMAMI &amp; AFETO</text>
    <text x="30" y="98" fill="#FBFAF4" font-family="monospace" font-weight="700" font-size="20">COMIDA QUE CONECTA</text>
  </g>
</svg>
