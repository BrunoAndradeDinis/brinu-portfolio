<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 728" fill="none">
  <rect width="1120" height="728" fill="#080808"/>
  <g opacity="0.22" stroke="#FE0000" stroke-width="1">
    <line x1="0" y1="120" x2="1120" y2="120"/>
    <line x1="0" y1="240" x2="1120" y2="240"/>
    <line x1="0" y1="360" x2="1120" y2="360"/>
    <line x1="0" y1="480" x2="1120" y2="480"/>
    <line x1="0" y1="600" x2="1120" y2="600"/>
    <line x1="224" y1="0" x2="224" y2="728"/>
    <line x1="448" y1="0" x2="448" y2="728"/>
    <line x1="672" y1="0" x2="672" y2="728"/>
    <line x1="896" y1="0" x2="896" y2="728"/>
  </g>
  <!-- Inverted Diagonal Slash -->
  <polygon points="460,0 1120,0 1120,728 260,728" fill="#FE0000"/>
  <polygon points="440,0 475,0 275,728 240,728" fill="#FBFAF4"/>
  <!-- Kaneda Capsule Visual -->
  <g transform="translate(80, 160)">
    <rect x="0" y="0" width="400" height="260" fill="#080808" stroke="#FBFAF4" stroke-width="6"/>
    <!-- Capsule Geometry -->
    <rect x="100" y="120" width="100" height="70" rx="35" fill="#FE0000" stroke="#FBFAF4" stroke-width="6"/>
    <rect x="200" y="120" width="100" height="70" rx="35" fill="#30B5BB" stroke="#FBFAF4" stroke-width="6"/>
    <text x="28" y="44" fill="#FBFAF4" font-family="monospace" font-weight="900" font-size="20">REEL 04 // AKIRA 1988</text>
  </g>
  <!-- Typography -->
  <text x="80" y="540" fill="#FBFAF4" font-family="sans-serif" font-weight="900" font-size="72" letter-spacing="-2">AKIRA</text>
  <text x="80" y="605" fill="#FBFAF4" font-family="monospace" font-weight="700" font-size="28">KATSUHIRO OTOMO // NEO-TOKYO CYBERPUNK</text>
  <text x="80" y="650" fill="#EBA602" font-family="monospace" font-weight="700" font-size="22">KANEDA'S BIKE // ESTÉTICA CYBERPUNK 1988</text>
  <!-- Right Badge -->
  <g transform="translate(680, 210) rotate(-5)">
    <rect x="0" y="0" width="370" height="130" fill="#080808" stroke="#FBFAF4" stroke-width="6"/>
    <text x="30" y="58" fill="#FE0000" font-family="monospace" font-weight="900" font-size="32">GOOD FOR HEALTH</text>
    <text x="30" y="98" fill="#FBFAF4" font-family="monospace" font-weight="700" font-size="20">BAD FOR EDUCATION</text>
  </g>
</svg>
